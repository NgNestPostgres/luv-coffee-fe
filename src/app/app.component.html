
<div class="app-wrapper">
  <mat-toolbar class="mat-elevation-z2">
    <mat-toolbar-row>
      <button
        aria-label="Side navigation menu icon"
        mat-icon-button
        [class.g-hide]="!tabQuery.matches"
        (click)="sidenav.toggle()"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <a
        class="logo-link"
        title="HomePage"
        [routerLink]="['']"
      >
        <img class="logo-img" src="/assets/images/logo.svg" />
      </a>

      <anp-top-menu class="top-menu" [class.g-hide]="tabQuery.matches"></anp-top-menu>
      <span class="toolbar-spacer"></span>
      <anp-search-box></anp-search-box>
      <span class="toolbar-spacer"></span>
      <anp-theme-manager></anp-theme-manager>
    </mat-toolbar-row>
  </mat-toolbar>

  <mat-sidenav-container>
    <mat-sidenav
      #sidenav
      closed
      [mode]="mobileQuery.matches ? 'over' : 'side'"
    >
      <anp-sidenav-tree (menuItemChosen)="mobileQuery.matches && sidenav.close()"></anp-sidenav-tree>
    </mat-sidenav>

    <mat-sidenav-content>
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
