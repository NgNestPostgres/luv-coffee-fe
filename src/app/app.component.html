
<div class="app-wrapper">
  <mat-toolbar class="mat-elevation-z2">
    <mat-toolbar-row>
      <anp-main-toolbar (sidenavToggled)="toggleSidnav()"></anp-main-toolbar>
    </mat-toolbar-row>
  </mat-toolbar>

  <mat-sidenav-container>
    <mat-sidenav
      #sidenav
      [class.g-hide]="isDesktop()"
      [mode]="isMobile() ? 'over' : 'side'"
    >
      <anp-sidenav-tree
        (menuItemChosen)="!isDesktop() && sidenav.close()"
      ></anp-sidenav-tree>
    </mat-sidenav>

    <mat-sidenav-content>
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
